function completeMoment(r){if(!r.replay){state.reading=null;if(!state.seen.includes(r.item.id))state.seen.push(r.item.id);state.records[r.item.id]={choices:{...state.choices},act:state.act,photo:memoryPhoto()};refreshWorld();save();markers();toast(t('collected'));}closeModal();updateHints();}
function choose(item,choice){if(state.choices[item.id]!==undefined)return;state.reading=null;state.previousChoices={...state.choices};state.choices[item.id]=choice.id;state.records[item.id]={choices:{...state.choices},choice:choice.id,act:state.act,photo:memoryPhoto()};if(!state.seen.includes(item.id))state.seen.push(item.id);state.act=Math.min(DATA.acts.length,state.act+1);if(state.act>=DATA.acts.length){state.ending=DATA.endingRules.find(rule=>matches(rule.when))?.ending||DATA.endings[0].id;state.endingPage=0;if(!state.endings.includes(state.ending))state.endings.push(state.ending);}ghost=false;$('ghostButton').classList.remove('ghost-on');$('ghostButton').setAttribute('aria-pressed','false');refreshWorld();save();markers();formatHUD();showReply(item,choice);}
function showReply(item,choice){reader=null;const p=baseModal('reply',t('replyHeading'),{reading:true,channel:item.channel});modal.item=item;modal.choice=choice;heading(p,t('replyHeading'),date(item.year));p.append(el('p','reply',text(choice.reply)),el('p','small',t('changed')),button(t('back'),()=>{closeModal();if(state.act>=DATA.acts.length)beginEnding();else{const next=nearest();if(next)toast(t('seek',{year:Math.floor(next.year)}));}},'primary'));}
function beginEnding(){const rule=DATA.endingRules.find(rule=>matches(rule.when));state.ending=rule?.ending||DATA.endings[0].id;state.endingPage=0;state.year=2026;if(!state.endings.includes(state.ending))state.endings.push(state.ending);refreshWorld();updateYear();save();renderEnding();}
function renderEnding(){if(state.year!==2026){state.year=2026;refreshWorld();updateYear();}const ending=DATA.endings.find(e=>e.id===state.ending);if(!ending)return;reader=null;playing=false;const endLines=linesFor(ending);const finished=state.endingPage>=endLines.length,p=baseModal('ending',text(ending.title),{ending:true});if(finished){heading(p,text(ending.title),t('endingLabel'));p.append(el('p','',text(ending.caption)),el('div','small',t('endingsCount',{n:state.endings.length})),el('p','small',t('endingOther')),button(t('returnRoom'),closeModal),button(t('returnChoices'),showChoiceReturn),button(t('endAgain'),()=>{state.endingPage=0;renderEnding();}));}else{heading(p,'',date(2026));p.append(el('p','ending-line',text(endLines[state.endingPage])),button(t('next'),()=>{state.endingPage++;save();renderEnding();},'primary'));}}
function showChoiceReturn(){const p=baseModal('choices',t('returnChoices'));heading(p,t('returnChoices'));p.append(el('p','',t('choiceInfo')));for(let i=0;i<DATA.acts.length;i++){const c=DATA.acts[i].contact;if(!state.choices[c.id])continue;const chosen=c.choices.find(v=>v.id===state.choices[c.id]);p.append(button(date(c.year)+' · '+text(chosen?.label||c.title),()=>{const old={...state.choices};for(let j=i;j<DATA.acts.length;j++){const a=DATA.acts[j];delete state.choices[a.contact.id];for(const m of j===i?[a.contact]:[...a.moments,a.contact]){state.seen=state.seen.filter(v=>v!==m.id);delete state.records[m.id];}}state.previousChoices=old;state.act=i;state.reading=null;state.ending=null;state.endingPage=0;ghost=false;closeModal();setYear(c.year);formatHUD();markers();save();}));}}
function stopPlaying(){playing=false;formatHUD();}
$('time').addEventListener('input',()=>{suspendedReader=null;if(modal)closeModal();playing=false;setYear(Number($('time').value));$('playButton').textContent='▷';$('playButton').setAttribute('aria-pressed','false');});$('time').addEventListener('change',save);$('time').addEventListener('pointerdown',()=>{audio?.start();lastAction=performance.now();});
$('playButton').onclick=()=>{if(modal)closeModal();audio?.start();playing=!playing;lastAction=performance.now();settledAt=performance.now();formatHUD();};
$('ghostButton').onclick=()=>{if(!state.previousChoices)return toast(t('noGhost'));ghost=!ghost;$('ghostButton').classList.toggle('ghost-on',ghost);$('ghostButton').setAttribute('aria-pressed',ghost);room?.setGhost(world(state.previousChoices),ghost);toast(ghost?t('before'):t('timelineChanged'));};
$('journalButton').onclick=()=>{playing=false;showJournal();};$('objectsButton').onclick=showObjects;$('settingsButton').onclick=()=>{suspendedReader=reader?{...reader}:null;showSettings();};$('helpButton').onclick=()=>showHelp();
$('momentHint').onclick=()=>{if(state.act>=DATA.acts.length){renderEnding();return;}const n=near();if(n)openMoment(n);else{const next=nearest();if(next){setYear(next.year);settledAt=performance.now()-500;}}};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();return;}if(e.key==='Tab'&&modal){const focusable=[...$('modalRoot').querySelectorAll('button,input,select,[tabindex="0"]')].filter(e=>!e.disabled);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.tagName==='SECTION')){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;save();}else{lastFrame=performance.now();settledAt=performance.now();}});window.addEventListener('pagehide',save);document.addEventListener('pointerdown',()=>{lastAction=performance.now();},{passive:true});
for(let y=1926;y<=2026;y+=10)$('hud').querySelector('.ticks').append(el('span','',y));
formatHUD();
try{room=createRoom(THREE,$('room'),id=>{if(active&&!reader)showInspect(id);});room.setQuality(state.settings.quality);audio=createAudio();audio.setVolume(state.settings.volume);audio.setSpeech(state.settings.speech);refreshWorld();window.__ready=true;$('beginButton').disabled=false;$('loadStatus').textContent='';}catch(err){$('loadStatus').textContent=state.lang==='ru'?'Комната не открылась. Обновите страницу в браузере с поддержкой WebGL.':'The room could not open. Reload in a browser with WebGL support.';console.error('Room initialization failed',err);}
$('beginButton').onclick=()=>{audio?.start();const first=!state.started;state.started=true;active=true;settledAt=performance.now();lastAction=settledAt;$('room').style.opacity=1;$('hud').style.opacity=1;$('hud').setAttribute('aria-hidden','false');$('opening').classList.add('fade');setTimeout(()=>$('opening').classList.add('hidden'),2200);formatHUD();markers();save();if(first)setTimeout(()=>showHelp(true),1250);else if(state.ending)setTimeout(renderEnding,1250);};
function frame(now){requestAnimationFrame(frame);const dt=Math.max(0,Math.min(.06,(now-(lastFrame||now))/1000));lastFrame=now;if(document.hidden)return;room?.update(dt,now/1000);if(!active)return;state.elapsed+=dt;if(playing&&!modal){setYear(state.year+dt*Number($('speed').value),false);const n=near();if(n){playing=false;settledAt=now;formatHUD();}if(state.year>=2026)stopPlaying();}if(!modal&&!playing&&now>ignoreAutoUntil){const n=near();if(n&&now-settledAt>1450&&triggerKey!==n.id){triggerKey=n.id;openMoment(n);}else if(now-lastAction>25000)updateHints();}if(now-saveAt>8000){saveAt=now;save();}}
requestAnimationFrame(frame);
